[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vidqa-cli"  # "vidqa" is taken on PyPI; module and CLI stay `vidqa`
version = "0.2.0"
description = "Local, deterministic video QA: frame timing, golden-frame diff, scene cuts. Compact JSON for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Smereski" }]
keywords = ["video", "qa", "ffmpeg", "frametime", "testing", "mcp", "agents"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scenedetect>=0.6",
    "rapidocr>=2.0",
    "onnxruntime>=1.20",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
speech = ["faster-whisper>=1.1"]

[project.urls]
Repository = "https://github.com/DSmereski/vidqa"

[project.scripts]
vidqa = "vidqa.cli:main"
vidqa-mcp = "vidqa.mcp_server:main"

[tool.setuptools.packages.find]
include = ["vidqa*"]
